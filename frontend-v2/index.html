<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08080a" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="NeuralTicker — AI-powered stock research, risk analysis and portfolio tracking." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NeuralTicker" />
  <title>NeuralTicker</title>
  <script>
    // Apply the saved theme's canvas before first paint (prevents a flash).
    // Keep in step with BOOT_VARS in src/app/theme.ts.
    (function () {
      var theme = 'dark';
      try { theme = localStorage.getItem('theme-preference') || 'dark'; } catch (e) { /* private mode */ }
      var names = ['bg', 'text', 'muted', 'accent', 'up', 'down', 'grid', 'blob', 'blob-2', 'shadow'];
      var dark = ['#08080a', '#f4f4f5', '#a1a1aa', '#a78bfa', '#34d399', '#fb7185',
        'rgba(128, 128, 128, 0.05)', 'rgba(148, 163, 184, 0.08)', 'rgba(148, 163, 184, 0.06)', '0 0 20px rgba(255, 255, 255, 0.18)'];
      var vars = {
        dark: dark,
        rgb: ['#08080a', '#f4f4f5', '#a1a1aa', '#a78bfa', '#34d399', '#fb7185',
          'rgba(128, 128, 128, 0.05)', 'rgba(139, 92, 246, 0.15)', 'rgba(16, 185, 129, 0.15)', '0 0 20px rgba(255, 255, 255, 0.18)'],
        light: ['#f0f1f4', '#09090b', '#5f5f69', '#6d28d9', '#047857', '#be123c',
          'rgba(0, 0, 0, 0.04)', 'rgba(37, 99, 235, 0.05)', 'rgba(37, 99, 235, 0.03)', 'none'],
        gray: ['#e4e4e7', '#18181b', '#52525b', '#6d28d9', '#047857', '#be123c',
          'rgba(0, 0, 0, 0.04)', 'rgba(37, 99, 235, 0.05)', 'rgba(37, 99, 235, 0.03)', 'none']
      }[theme] || dark;
      var root = document.documentElement;
      for (var i = 0; i < names.length; i++) root.style.setProperty('--boot-' + names[i], vars[i]);
    })();
  </script>
  <style>
    body {
      margin: 0;
      background-color: var(--boot-bg, #08080a);
      font-family: 'Inter Variable', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* Loading screen: the wordmark over a candlestick chart that draws itself,
       a status line and a progress bar, on a faint grid.

       These rules are the ONLY definition of it. The React loader
       (src/components/ui/SuperLoading.tsx) renders the same class names, so
       the hand-off from this HTML to the app is invisible and the two can
       never drift apart. Do not move them into the app's stylesheet: the
       splash paints before that stylesheet exists. */
    .boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: var(--boot-bg, #08080a);
      color: var(--boot-text, #f4f4f5);
    }

    /* In the app: above the page, below dialogs — or below the header. */
    .boot--app { z-index: 50; }
    .boot--below-header { top: 3.5rem; z-index: 40; }

    .boot-backdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--boot-grid, rgba(128, 128, 128, 0.05)) 1px, transparent 1px),
        linear-gradient(90deg, var(--boot-grid, rgba(128, 128, 128, 0.05)) 1px, transparent 1px),
        radial-gradient(circle at 15% 20%, var(--boot-blob, rgba(148, 163, 184, 0.08)), transparent 35%),
        radial-gradient(circle at 80% 0%, var(--boot-blob-2, rgba(148, 163, 184, 0.06)), transparent 30%);
      background-size: 28px 28px, 28px 28px, 100% 100%, 100% 100%;
      background-position: center top;
      background-repeat: repeat, repeat, no-repeat, no-repeat;
    }

    .boot-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 24rem;
      padding: 20px;
      box-sizing: border-box;
    }

    .boot-brand {
      display: flex;
      align-items: baseline;
      margin: 0;
      font-size: clamp(2rem, 9vw, 2.75rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      text-shadow: var(--boot-shadow, none);
      animation: bootPulse 3s ease-in-out infinite;
    }

    /* A ticker being opened takes the wordmark's place, thin and large. */
    .boot-brand--symbol {
      font-size: clamp(2.5rem, 12vw, 3.5rem);
      font-weight: 300;
    }

    /* The mark is the first letter of the wordmark — same figures as
       src/components/common/Brand.tsx. */
    .boot-brand svg {
      height: 0.76em;
      width: auto;
      flex: none;
      margin-right: 0.05em;
      transform: translateY(0.02em);
    }

    .boot-brand span span,
    .boot-version {
      color: var(--boot-muted, #a1a1aa);
    }

    .boot-chart {
      position: relative;
      width: min(320px, 78vw);
      height: min(320px, 38vh);
      margin: 30px 0 26px;
    }

    .boot-candle {
      position: absolute;
      width: 12px;
      border-radius: 1px;
      opacity: 0;
      animation: bootCandle 4s infinite;
    }

    .boot-candle.up { background: var(--boot-up, #34d399); }
    .boot-candle.down { background: var(--boot-down, #fb7185); }

    /* Wick */
    .boot-candle::before {
      content: '';
      position: absolute;
      left: 50%;
      top: -15px;
      bottom: -15px;
      width: 2px;
      transform: translateX(-50%);
      background: inherit;
      opacity: 0.5;
    }

    .boot-status,
    .boot-version {
      margin: 0;
      font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 500;
    }

    .boot-status {
      margin-bottom: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      color: var(--boot-text, #f4f4f5);
    }

    .boot-bar {
      width: 200px;
      max-width: 100%;
      height: 2px;
      overflow: hidden;
      border-radius: 2px;
      background: rgba(128, 128, 128, 0.2);
    }

    .boot-bar div {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, var(--boot-accent, #a78bfa), var(--boot-up, #34d399));
      animation: bootProgress 2s linear infinite;
    }

    .boot-version {
      position: absolute;
      left: 32px;
      bottom: 32px;
      opacity: 0.7;
    }

    @keyframes bootCandle {
      0% { opacity: 0; transform: scaleY(0.5); }
      10%, 70% { opacity: 1; transform: scaleY(1); }
      80%, 100% { opacity: 0; transform: scaleY(0.5); }
    }

    @keyframes bootProgress {
      from { transform: translateX(-100%); }
      to { transform: translateX(334%); }
    }

    @keyframes bootPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-brand { animation: none; }
      .boot-candle { animation: none; opacity: 1; }
      .boot-bar div { animation: none; width: 100%; opacity: 0.5; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot" role="status" aria-label="Loading NeuralTicker">
      <div class="boot-backdrop" aria-hidden="true"></div>
      <div class="boot-content">
        <div class="boot-brand">
          <svg viewBox="0 0 400 512" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="boot-n" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7c3aed" />
                <stop offset="100%" stop-color="#4f46e5" />
              </linearGradient>
            </defs>
            <rect x="300" y="0" width="100" height="512" rx="50" fill="#4338ca" />
            <rect x="0" y="0" width="100" height="512" rx="50" fill="#6d28d9" />
            <line x1="50" y1="50" x2="350" y2="462" stroke="url(#boot-n)" stroke-width="100" stroke-linecap="round" />
          </svg>
          <span aria-hidden="true">euralTicker<span>.com</span></span>
        </div>
        <!-- The same eleven candles as SuperLoading.tsx (CANDLES). -->
        <div class="boot-chart" aria-hidden="true">
          <span class="boot-candle up" style="left: 5%; bottom: 30%; height: 35%; animation-delay: 0.1s"></span>
          <span class="boot-candle down" style="left: 13%; bottom: 40%; height: 25%; animation-delay: 0.2s"></span>
          <span class="boot-candle up" style="left: 21%; bottom: 45%; height: 30%; animation-delay: 0.3s"></span>
          <span class="boot-candle down" style="left: 29%; bottom: 50%; height: 15%; animation-delay: 0.4s"></span>
          <span class="boot-candle up" style="left: 37%; bottom: 48%; height: 40%; animation-delay: 0.5s"></span>
          <span class="boot-candle up" style="left: 45%; bottom: 70%; height: 25%; animation-delay: 0.6s"></span>
          <span class="boot-candle down" style="left: 53%; bottom: 55%; height: 35%; animation-delay: 0.7s"></span>
          <span class="boot-candle down" style="left: 61%; bottom: 40%; height: 20%; animation-delay: 0.8s"></span>
          <span class="boot-candle up" style="left: 69%; bottom: 42%; height: 15%; animation-delay: 0.9s"></span>
          <span class="boot-candle up" style="left: 77%; bottom: 48%; height: 45%; animation-delay: 1.0s"></span>
          <span class="boot-candle up" style="left: 85%; bottom: 75%; height: 20%; animation-delay: 1.1s"></span>
        </div>
        <p class="boot-status">Loading</p>
        <div class="boot-bar"><div></div></div>
      </div>
      <span class="boot-version">v%APP_VERSION%</span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
