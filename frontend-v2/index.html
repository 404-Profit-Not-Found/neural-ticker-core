<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Neural Ticker v2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="favicon.png" />
  <title>NEURAL//TICKER — Pixel Terminal (v2)</title>

  <!-- Pixel fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <!-- React 18 + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Mock data (plain JS) -->
  <script src="src/data.js"></script>

  <!-- v2 API client (window.API + window.useApi) -->
  <script src="src/api.js"></script>

  <!-- Tweaks shell -->
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>

  <!-- Pixel UI primitives -->
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/skeletons.jsx"></script>

  <!-- Screens -->
  <script type="text/babel" src="src/dashboard.jsx"></script>
  <script type="text/babel" src="src/ticker-detail.jsx"></script>
  <script type="text/babel" src="src/analyzer.jsx"></script>
  <script type="text/babel" src="src/chrome.jsx"></script>

  <!-- v2-only features -->
  <script type="text/babel" src="src/command-palette.jsx"></script>
  <script type="text/babel" src="src/chat-overlay.jsx"></script>
  <script type="text/babel" src="src/workspace.jsx"></script>
  <script type="text/babel" src="src/pages.jsx"></script>
  <script type="text/babel" src="src/help-dialog.jsx"></script>
  <script type="text/babel" src="src/compare.jsx"></script>
  <script type="text/babel" src="src/toast-bus.jsx"></script>

  <!-- App shell (mounts last) -->
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
