<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Neural Ticker — Mobile Preview</title>
<style>
  body {
    margin: 0;
    background: #1a1a1a;
    color: #888;
    font-family: monospace;
    display: flex;
    gap: 24px;
    padding: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .device {
    background: #000;
    border: 8px solid #111;
    border-radius: 32px;
    padding: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .device iframe {
    border: none;
    border-radius: 24px;
    display: block;
  }
  .label {
    text-align: center;
    margin-top: 8px;
    color: #888;
    font-size: 12px;
    letter-spacing: 0.1em;
  }
  .phone iframe { width: 390px; height: 844px; }
  .tablet iframe { width: 768px; height: 1024px; }
</style>
</head>
<body>
  <div>
    <div class="device phone">
      <iframe src="Neural Ticker.html"></iframe>
    </div>
    <div class="label">IPHONE 14 — 390×844</div>
  </div>
  <div>
    <div class="device tablet">
      <iframe src="Neural Ticker.html"></iframe>
    </div>
    <div class="label">IPAD MINI — 768×1024</div>
  </div>
</body>
</html>
