name: Cron Jobs

permissions:
  contents: read

on:
  schedule:
    # Daily at Midnight UTC (Watchers Sync, Moderation, Research cleanup)
    - cron: '0 0 * * *'
    # Hourly (Candle Sync batch, Risk/Reward Scanner, Posts Sync, Cleanup)
    - cron: '0 * * * *'
    # Every 5 mins during market hours (6 AM - 9 PM UTC, Mon-Fri)
    # Used by: snapshot-sync (price tick) + market-hours-refresh (top picks, portfolios)
    - cron: '*/5 6-21 * * 1-5'
    # Every 5 minutes (24/7) - daily digest, queue processor
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  daily-jobs:
    runs-on: ubuntu-latest
    environment: prod
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Daily Watchers Sync
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/stocktwits/jobs/sync-watchers" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

      - name: Moderate Comments (LLM)
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/social/moderation/scan" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

      - name: Cleanup Old Research (>90 days + orphaned analyses)
        run: curl -X POST ${{ vars.CLOUD_RUN_URL }}/api/v1/jobs/cleanup-old-research -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" -H "Content-Type:application/json"

  hourly-jobs:
    runs-on: ubuntu-latest
    environment: prod
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      # Daily (1d) candle sync, split into a small stale-first batch per hour so
      # each run stays well under the Cloud Run 5-min request timeout. Full
      # universe coverage is reached over the course of the day (oldest 1d
      # candle first). Previously ran once at midnight and timed out (504).
      - name: Trigger Candle Sync (hourly stale-first batch)
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/jobs/sync-daily-candles" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

      # Queues research for the most-stale tickers (never-analysed first, then
      # oldest), rotating through the whole universe on a ~weekly cadence. Hard
      # daily free-LLM budget caps total calls so it never hits the billed key.
      # Endpoint returns 202 immediately and runs the scan in the background.
      # This is the ONLY scanner trigger — hourly + a tiny batch keeps it gentle
      # (it used to also fire every 5 min, which front-loaded the daily budget).
      - name: Trigger Risk/Reward Scanner (stale-first rotation, budget-gated)
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/jobs/run-risk-reward-scanner" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

      - name: Trigger Hourly Posts Sync
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/stocktwits/jobs/sync-posts" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

      - name: Trigger Research Cleanup (Zombie Tickets)
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/jobs/cleanup-research" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

  # Light snapshot sync every 5 mins during market hours (Mon-Fri, 6 AM - 9 PM UTC)
  snapshot-sync:
    runs-on: ubuntu-latest
    environment: prod
    if: github.event.schedule == '*/5 6-21 * * 1-5' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Snapshot Sync
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/jobs/sync-snapshots" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

  # Top Picks + Portfolios refresh - only during market hours (Mon-Fri, 6-21 UTC)
  market-hours-refresh:
    runs-on: ubuntu-latest
    environment: prod
    if: github.event.schedule == '*/5 6-21 * * 1-5' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Top Picks Refresh
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/jobs/refresh-top-picks" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

      - name: Trigger Portfolio Refresh
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/jobs/refresh-portfolios" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

  # Frequent jobs (Every 5 mins, 24/7) - digest + queue
  frequent-jobs:
    runs-on: ubuntu-latest
    environment: prod
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      # NOTE: the Risk/Reward Scanner intentionally does NOT run here. It runs
      # ONLY hourly (see hourly-jobs). Running it every 5 min front-loaded the
      # daily LLM budget (blasted the whole day's quota in ~4h, then idled) and
      # hammered the rate limits in bursts. Hourly + a tiny batch (3) spreads the
      # work gently across the day.
      - name: Trigger Daily Digest Generation
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/jobs/daily-digest" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"

      - name: Trigger Process Request Queue
        run: |
          curl --fail-with-body --show-error -sS -X POST "${{ vars.CLOUD_RUN_URL }}/api/v1/jobs/process-requests" \
            -H "X-Cron-Secret:${{ secrets.CRON_SECRET }}" \
            -H "Content-Type:application/json"
