name: Deploy to Cloud Run (manual fallback)

# Since 2026-10-21 the live deploy path is the Cloud Build trigger
# `rmgpgab-neural-ticker-core-us-central1-404-Profit-Not-Found-ceo`: it builds the
# Dockerfile on every push to `main` and runs `gcloud run services update --image`
# as the Cloud Run runtime service account — no key stored anywhere.
#
# This workflow used to run on every push as well (two deploys per push), and its
# `env_vars` passed the service-account JSON through `--set-env-vars`, which split
# it on commas and left the private key readable in the service configuration
# (see docs/PUBLIC_LAUNCH_ASSESSMENT_2026-10-21.md, P0-1). It is kept only as a
# manual fallback for building and deploying one commit. Environment variables of
# the service are managed on the service itself (scripts/launch/00-cloudrun-fix-env.sh)
# and are NOT touched here. The old key was deleted; to use this workflow again,
# create a fresh key and store it as GCP_SA_KEY, or set up Workload Identity Federation.

on:
  workflow_dispatch:

env:
  PROJECT_ID: neuro-b7a51
  REGION: us-central1
  REPO_NAME: neural-repo
  SERVICE_NAME: neural-ticker-core
  IMAGE_NAME: neural-ticker-core

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 'Google Auth'
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Configure Docker'
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: 'Build and Push Container'
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # No `env_vars` on purpose: the service keeps the environment it already has.
      - name: 'Deploy to Cloud Run'
        id: deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          timeout: '5m'
          flags: '--allow-unauthenticated --no-use-http2'

      - name: 'Show Output'
        run: echo ${{ steps.deploy.outputs.url }}
